<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon 8bit版本圖鑑</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    .pixelated {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    /* 自訂捲軸樣式 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0f172a] flex flex-col items-center p-4 text-slate-100">

  <!-- 頂部標題 -->
  <div class="mb-6 text-center mt-4">
    <h1 class="text-yellow-400 text-3xl font-black flex items-center justify-center gap-2 drop-shadow-md">
      <i data-lucide="zap" class="fill-yellow-400 w-8 h-8"></i>
      Pokemon 8bit版本圖鑑
      <i data-lucide="zap" class="fill-yellow-400 w-8 h-8"></i>
    </h1>
    <p class="text-emerald-400 text-xs mt-2 font-mono uppercase flex items-center justify-center gap-1">
      <i data-lucide="database" class="w-3 h-3"></i> Connected to Firestore
    </p>
  </div>

  <!-- 搜尋列 -->
  <form id="searchForm" class="mb-8 w-full max-w-sm flex shadow-2xl z-20">
    <input
      id="searchInput"
      type="number"
      min="1"
      max="1025"
      placeholder="輸入編號 (1 ~ 1025)"
      class="flex-grow bg-slate-800 border-2 border-slate-700 p-4 outline-none focus:border-yellow-500 transition-colors text-lg font-bold rounded-l-xl text-white"
      required
    />
    <button type="submit" class="bg-red-600 text-white px-8 border-2 border-red-800 hover:bg-red-500 active:translate-y-1 transition-transform rounded-r-xl font-bold">
      <i data-lucide="search" class="w-6 h-6"></i>
    </button>
  </form>

  <!-- 全新雙螢幕圖鑑設計 (左：資料, 右：取得方式與控制) -->
  <div class="flex flex-col md:flex-row w-full max-w-6xl mx-auto drop-shadow-[0_25px_50px_rgba(0,0,0,0.6)] mb-12">

    <!-- ================== 左半部 (經典主螢幕資料區) ================== -->
    <div class="w-full md:w-[60%] bg-[#ef4444] rounded-t-[40px] md:rounded-t-none md:rounded-l-[40px] p-4 md:p-8 border-b-[16px] md:border-r-[8px] border-[#991b1b] relative z-10 flex flex-col min-h-[600px]">
       
       <!-- 左上角經典指示燈 -->
       <div class="flex items-start gap-4 mb-6">
         <div class="w-16 h-16 bg-[#38bdf8] rounded-full border-[6px] border-white shadow-[0_0_20px_rgba(56,189,248,0.8)] flex-shrink-0"></div>
         <div class="flex gap-2 pt-3">
           <div id="indicator-cloud" class="w-4 h-4 rounded-full bg-red-500 border-2 border-black/50 shadow-inner transition-colors"></div>
           <div id="indicator-api" class="w-4 h-4 rounded-full bg-yellow-600 border-2 border-black/50 shadow-inner transition-colors"></div>
           <div class="w-4 h-4 rounded-full bg-green-500 border-2 border-black/50 shadow-inner"></div>
         </div>
       </div>

       <!-- 左側螢幕容器 (內嵌原有的視圖系統) -->
       <div class="bg-[#f8fafc] rounded-2xl p-4 md:p-6 border-[12px] border-b-[40px] border-[#334155] shadow-inner flex-grow flex flex-col relative">
          
          <div id="data-source-label" class="absolute top-2 right-2 flex items-center gap-1 text-[9px] font-black text-slate-400 uppercase tracking-wider hidden z-20"></div>

          <!-- 載入中 -->
          <div id="view-loading" class="flex-grow flex flex-col items-center justify-center gap-4 hidden">
            <i data-lucide="loader-2" class="w-12 h-12 animate-spin text-slate-400"></i>
            <p class="text-slate-500 font-bold">資料庫連線中...</p>
          </div>

          <!-- 錯誤 -->
          <div id="view-error" class="flex-grow flex flex-col items-center justify-center text-red-600 font-black text-xl py-10 text-center hidden px-2">
            <span id="error-text">發生錯誤</span>
            <div id="error-hint" class="text-sm font-normal text-slate-300 mt-6 bg-slate-800 p-4 rounded-lg text-left hidden w-full shadow-inner border border-slate-700">
              <p class="mb-2 text-yellow-400 font-bold flex items-center gap-1"><i data-lucide="info" class="w-4 h-4"></i> 權限問題：請檢查 Firestore Rules。</p>
            </div>
          </div>

          <!-- 寶可夢主資料區 -->
          <div id="view-pokemon" class="animate-fade-in flex-grow flex flex-col hidden">
            
            <!-- 名稱列 (修正：移除 truncate 避免被切斷，改為允許斷行) -->
            <div class="bg-[#1e293b] text-white p-3 rounded-lg mb-4 flex justify-between items-center px-4 shadow-md gap-2">
              <span id="poke-id" class="text-lg md:text-xl font-black font-mono text-cyan-300 bg-slate-800 px-3 py-1 rounded-xl shadow-[0_0_15px_rgba(34,211,238,0.2)] border border-cyan-700/50 tracking-wider flex-shrink-0"></span>
              <span id="poke-name" class="text-lg md:text-2xl font-black text-yellow-400 tracking-wide text-right break-words leading-tight"></span>
            </div>

            <!-- 圖片與新功能區塊 -->
            <div class="flex justify-center mb-4 bg-white rounded-xl border-4 border-slate-300 p-4 shadow-sm h-48 items-center relative overflow-hidden">
              <button id="btn-regional" class="absolute top-2 left-2 z-20 bg-indigo-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow border border-indigo-800 hover:bg-indigo-500 active:scale-95 transition-all hidden flex items-center gap-1 cursor-pointer" title="點擊切換不同型態">
                <i data-lucide="refresh-cw" class="w-3 h-3"></i> 切換型態
              </button>
              <button id="btn-shiny" class="absolute top-2 right-2 z-20 bg-slate-800 text-yellow-400 p-2 rounded-full border-2 border-slate-600 hover:bg-slate-700 active:scale-95 transition-all hidden" title="切換色違">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
              </button>
              <img id="poke-sprite" src="" alt="pokemon" class="w-48 h-48 pixelated drop-shadow-md z-10 transition-transform" />
              <span id="poke-sprite-fallback" class="text-slate-400 font-bold hidden z-10">無圖像資料</span>
              <div class="absolute w-full h-1/2 bg-slate-100 bottom-0 z-0"></div>
            </div>

            <!-- 屬性 -->
            <div id="poke-types" class="flex justify-center gap-3 mb-4"></div>

            <!-- 數值 -->
            <div class="grid grid-cols-2 gap-4 mb-4">
              <div class="bg-slate-100 p-2 rounded-xl flex items-center justify-center gap-2 border-2 border-slate-200">
                <i data-lucide="thermometer" class="text-slate-600 w-4 h-4"></i>
                <span id="poke-height" class="text-base font-black text-slate-800"></span>
              </div>
              <div class="bg-slate-100 p-2 rounded-xl flex items-center justify-center gap-2 border-2 border-slate-200">
                <i data-lucide="weight" class="text-slate-600 w-4 h-4"></i>
                <span id="poke-weight" class="text-base font-black text-slate-800"></span>
              </div>
            </div>

            <!-- 圖鑑說明 (跨世代選單) -->
            <div class="bg-[#1e293b] p-3 rounded-xl border-l-[8px] border-yellow-400 flex-grow shadow-lg flex flex-col relative min-h-[90px]">
              <div class="flex justify-between items-center mb-1 border-b border-slate-700 pb-1">
                <span class="text-[10px] text-yellow-400 font-bold tracking-widest flex items-center gap-1">
                   <i data-lucide="book-open" class="w-3 h-3"></i>圖鑑檔案
                </span>
                <select id="flavor-version-select" class="bg-slate-800 text-yellow-400 text-[10px] font-bold outline-none border border-slate-600 rounded p-1 cursor-pointer hover:bg-slate-700 transition-colors max-w-[120px]"></select>
              </div>
              <p id="poke-flavor" class="text-white text-xs leading-relaxed font-bold mt-1 overflow-y-auto custom-scrollbar pr-1"></p>
            </div>
          </div>
       </div>
    </div>

    <!-- ================== 中間鉸鏈 (僅大螢幕顯示) ================== -->
    <div class="hidden md:flex w-8 bg-[#dc2626] border-y-[16px] border-[#991b1b] flex-col justify-evenly shadow-[inset_10px_0_15px_rgba(0,0,0,0.3)] z-0">
       <div class="h-1/5 border-b-[6px] border-[#991b1b]/60"></div>
       <div class="h-1/5 border-b-[6px] border-[#991b1b]/60"></div>
       <div class="h-1/5 border-b-[6px] border-[#991b1b]/60"></div>
       <div class="h-1/5 border-b-[6px] border-[#991b1b]/60"></div>
       <div class="h-1/5"></div>
    </div>

    <!-- ================== 右半部 (棲息地與導覽按鈕區) ================== -->
    <div class="w-full md:flex-1 bg-[#ef4444] rounded-b-[40px] md:rounded-b-none md:rounded-r-[40px] p-4 md:p-8 border-b-[16px] md:border-l-[8px] border-[#991b1b] relative z-10 flex flex-col min-h-[600px] justify-between">
       
       <!-- 頂部黑螢幕：棲息地資料 -->
       <div>
         <div class="bg-slate-900 w-full h-40 rounded-lg shadow-[inset_0_5px_15px_rgba(0,0,0,0.8)] border-[6px] border-slate-800 p-3 flex flex-col mb-4">
            <div class="text-[10px] text-slate-400 border-b border-slate-700 pb-1 mb-2 font-black flex justify-between">
                <span>📍 棲息地 (取得方式)</span>
                <span id="encounter-version-label" class="text-yellow-400 font-mono">請選擇版本</span>
            </div>
            <ul id="encounter-list" class="flex-grow overflow-y-auto custom-scrollbar text-emerald-400 font-mono text-xs space-y-1.5 pr-2">
                <li class="text-slate-500 flex h-full items-center justify-center">等待讀取資料...</li>
            </ul>
         </div>

         <!-- 藍色矩陣按鈕 (版本選擇器) -->
         <div id="version-btn-grid" class="grid grid-cols-4 md:grid-cols-5 gap-1.5 mb-6 max-h-[120px] overflow-y-auto custom-scrollbar p-1">
            <!-- 動態生成藍色版本按鈕 -->
         </div>
       </div>

       <!-- 底部實體按鈕群 (完美還原相片配置，加上 md:mb-[180px] 將按鈕向上推擠對齊左側說明欄底部) -->
       <div class="mt-auto pt-8 md:mb-[180px]">
         
         <!-- 小紅燈 與 橫槓裝飾 -->
         <div class="flex items-center gap-2 mb-3 px-2">
           <div class="w-3 h-3 rounded-full bg-red-600 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]"></div>
           <div class="w-3 h-3 rounded-full bg-red-600 shadow-[inset_0_2px_4px_rgba(0,0,0,0.5)]"></div>
           <div class="flex-grow flex gap-3 justify-center pl-4">
              <div class="w-8 h-1.5 bg-black/70 rounded-full shadow-inner"></div>
              <div class="w-8 h-1.5 bg-black/70 rounded-full shadow-inner"></div>
           </div>
         </div>

         <!-- 白色長條 與 黃色按鈕 -->
         <div class="flex gap-4 items-center mb-6 px-2">
           <div class="flex">
             <div class="w-10 h-6 bg-white rounded-l-sm shadow-md border-b-[3px] border-slate-300 border-r border-slate-200"></div>
             <div class="w-10 h-6 bg-white rounded-r-sm shadow-md border-b-[3px] border-slate-300"></div>
           </div>
           <div class="w-8 h-8 rounded-full bg-yellow-400 shadow-md ml-auto border-b-[4px] border-yellow-600 active:border-b-0 active:translate-y-1 transition-all"></div>
         </div>

         <!-- 最底部兩顆深藍色大按鈕 (上一隻 / 下一隻) -->
         <div class="flex gap-4">
           <button id="btn-prev" class="flex-1 h-14 bg-[#0f172a] border-t-2 border-l-2 border-slate-600 border-b-4 border-r-4 border-black rounded shadow-[0_4px_0_#000] hover:bg-slate-800 active:translate-y-[4px] active:shadow-[0_0px_0_#000] active:border-b-2 active:border-r-2 flex items-center justify-center transition-all group cursor-pointer" title="上一隻">
             <!-- 實心倒三角形 (向左) -->
             <svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-cyan-400 group-hover:-translate-x-1 transition-transform drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]">
               <polygon points="18,4 6,12 18,20" />
             </svg>
           </button>
           <button id="btn-next" class="flex-1 h-14 bg-[#0f172a] border-t-2 border-l-2 border-slate-600 border-b-4 border-r-4 border-black rounded shadow-[0_4px_0_#000] hover:bg-slate-800 active:translate-y-[4px] active:shadow-[0_0px_0_#000] active:border-b-2 active:border-r-2 flex items-center justify-center transition-all group cursor-pointer" title="下一隻">
             <!-- 實心正三角形 (向右) -->
             <svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-cyan-400 group-hover:translate-x-1 transition-transform drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]">
               <polygon points="6,4 18,12 6,20" />
             </svg>
           </button>
         </div>

       </div>
    </div>
  </div>

  <!-- 資料庫核心同步工具 -->
  <div class="w-full max-w-lg bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg relative overflow-hidden mb-10">
    <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-white font-bold flex items-center gap-2">
        <i data-lucide="refresh-cw" class="text-emerald-400 w-5 h-5"></i> 自動資料庫升級系統
      </h3>
      <span class="text-xs bg-slate-900 px-2 py-1 rounded text-emerald-400 font-mono font-bold">自動淨化防護開啟</span>
    </div>
    
    <p class="text-slate-300 text-sm mb-4 leading-relaxed bg-slate-900/50 p-3 rounded border border-slate-700">
      點擊下方按鈕以套用最新升級。<br>本次將自動匯入<strong class="text-yellow-400">「地區型態切換」</strong>與<strong class="text-yellow-400">「完整登場版本紀錄」</strong>，系統將自動修復覆蓋地區型態的錯誤版本，並補上最新世代的資訊。
    </p>

    <!-- 同步中介面 -->
    <div id="sync-progress-container" class="w-full hidden">
      <div class="flex justify-between text-xs text-emerald-400 mb-1 font-mono">
        <span id="sync-status-text">INITIALIZING...</span>
        <span id="sync-percentage">0%</span>
      </div>
      <div class="w-full bg-slate-900 rounded-full h-3">
        <div id="sync-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 同步按鈕 -->
    <button id="sync-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-lg flex justify-center items-center gap-2 transition-colors border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1">
      <i data-lucide="download-cloud" class="w-5 h-5"></i> 執行全圖鑑升級與資料淨化
    </button>
  </div>

  <!-- Firebase 與核心邏輯腳本 -->

    function filterGamesByForm(gamesArr, apiName) {
      let minGen = 1;
      const lowerName = apiName.toLowerCase();
      
      if (lowerName.includes('-alola')) minGen = 7;
      else if (lowerName.includes('-galar')) minGen = 8;
      else if (lowerName.includes('-hisui')) minGen = 8;
      else if (lowerName.includes('-paldea')) minGen = 9;
      else if (lowerName.includes('-mega')) minGen = 6;
      else if (lowerName.includes('-gmax') || lowerName.includes('eternamax')) minGen = 8;
      else if (lowerName.includes('-world-cap')) minGen = 8;
      else if (lowerName.includes('-cap')) minGen = 7;
      else if (lowerName.includes('-starter')) minGen = 7;
      else if (lowerName.includes('-primal')) minGen = 6;
      else if (lowerName.includes('battle-bond')) minGen = 7;
      else if (lowerName.includes('zygarde-10') || lowerName.includes('zygarde-complete')) minGen = 7;
      else if (lowerName.includes('bloodmoon')) minGen = 9;
      else if (
        lowerName.includes('-cosplay') || 
        lowerName.includes('-rock-star') || 
        lowerName.includes('-belle') || 
        lowerName.includes('-pop-star') || 
        lowerName.includes('-phd') || 
        lowerName.includes('-libre')
      ) minGen = 6;

      return gamesArr.filter(g => {
          const gen = GAME_GENERATIONS[g] || 1;
          return gen >= minGen;
      });
    }

    // 動態讀取棲息地資料 (GraphQL)
    async function loadEncounters(targetId) {
      elements.encounterList.innerHTML = `<li class="text-slate-400 flex items-center justify-center h-full gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 搜尋棲息地中...</li>`;
      lucide.createIcons();
      elements.versionBtnGrid.innerHTML = '';
      elements.encounterVersionLabel.innerText = '讀取中...';

      try {
        const query = `
          query {
            pokemon_v2_pokemon(where: {id: {_eq: ${targetId}}}) {
              pokemon_v2_encounters {
                pokemon_v2_version { name }
                pokemon_v2_locationarea {
                  pokemon_v2_locationareanames {
                    name
                    pokemon_v2_language { name }
                  }
                }
              }
            }
          }
        `;
        const res = await fetch('https://beta.pokeapi.co/graphql/v1beta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const json = await res.json();
        const encounters = json.data.pokemon_v2_pokemon[0]?.pokemon_v2_encounters || [];

        const encounterMap = {};

        encounters.forEach(enc => {
          const vName = enc.pokemon_v2_version.name;
          const areaNames = enc.pokemon_v2_locationarea.pokemon_v2_locationareanames;

          const hant = areaNames.find(n => n.pokemon_v2_language.name.toLowerCase() === 'zh-hant');
          const tw = areaNames.find(n => n.pokemon_v2_language.name.toLowerCase() === 'zh-tw');
          const hans = areaNames.find(n => n.pokemon_v2_language.name.toLowerCase() === 'zh-hans');
          const ja = areaNames.find(n => n.pokemon_v2_language.name.toLowerCase() === 'ja');
          const jahrkt = areaNames.find(n => n.pokemon_v2_language.name.toLowerCase() === 'ja-hrkt');

          let locName = hant?.name || tw?.name || hans?.name;
          if (!locName) {
            if (ja || jahrkt) {
               locName = "[日文] " + (ja?.name || jahrkt?.name);
            } else {
               locName = "未知區域";
            }
          }

          if (!encounterMap[vName]) encounterMap[vName] = new Set();
          encounterMap[vName].add(locName);
        });

        const versions = Object.keys(encounterMap);
        if (versions.length === 0) {
           elements.encounterList.innerHTML = `<li class="text-slate-500 text-center flex items-center h-full">此型態無野外遇見紀錄。<br>(可能為進化、孵蛋、配佈或 NPC 贈送)</li>`;
           elements.encounterVersionLabel.innerText = '無版本可選';
           return;
        }

        // 渲染藍色版本按鈕陣列
        versions.forEach((v, index) => {
          const btn = document.createElement('button');
          // 修正：移除 truncate 單行截斷，改為 flex 置中與自動換行 (break-words) 以完整顯示文字
          btn.className = "bg-[#0ea5e9] text-white text-[10px] font-bold py-1 px-1 rounded shadow-md border-b-4 border-[#0284c7] active:border-b-0 active:translate-y-[4px] hover:bg-[#38bdf8] transition-all w-full min-h-[36px] flex items-center justify-center text-center break-words leading-tight";
          btn.innerText = VERSION_MAP[v] || v;
          btn.onclick = () => {
             // 重置其他按鈕狀態
             Array.from(elements.versionBtnGrid.children).forEach(b => {
                 b.classList.remove('ring-2', 'ring-white', 'bg-[#38bdf8]');
                 b.classList.add('bg-[#0ea5e9]');
             });
             btn.classList.add('ring-2', 'ring-white', 'bg-[#38bdf8]');
             btn.classList.remove('bg-[#0ea5e9]');
             
             elements.encounterVersionLabel.innerText = `【${VERSION_MAP[v] || v}】`;
             const locs = Array.from(encounterMap[v]);
             elements.encounterList.innerHTML = locs.map(l => `<li class="border-b border-slate-800 pb-1.5"><span class="mr-1">🔹</span>${l}</li>`).join('');

             // 新增：同步切換左側的圖鑑說明
             if (currentPokemonData && currentPokemonData.flavorTexts) {
                 const matchIdx = currentPokemonData.flavorTexts.findIndex(f => f.version === v);
                 if (matchIdx !== -1) {
                     // 更新左側的下拉選單選項
                     elements.flavorSelect.value = matchIdx;
                     // 同步更新左側的說明文字
                     elements.pokeFlavor.innerText = currentPokemonData.flavorTexts[matchIdx].text;
                 }
             }
          };
          elements.versionBtnGrid.appendChild(btn);

          // 預設點擊第一個版本
          if (index === 0) btn.click();
        });

      } catch (err) {
        console.error("Encounter Fetch Error:", err);
        elements.encounterList.innerHTML = `<li class="text-red-400 flex items-center justify-center h-full">無法載入棲息地資料</li>`;
        elements.encounterVersionLabel.innerText = '連線失敗';
      }
    }

    // 4. REST API 解析引擎
    async function fetchAndParseFromPokeAPI(targetId) {
      const pkmnRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${targetId}`, { cache: 'no-cache' });
      if (!pkmnRes.ok) throw new Error("API_NOT_FOUND");
      const pkmnData = await pkmnRes.json();

      const speciesRes = await fetch(pkmnData.species.url, { cache: 'no-cache' });
      if (!speciesRes.ok) throw new Error("API_NOT_FOUND");
      const speciesData = await speciesRes.json();

      let parsedName = null;
      if (speciesData.names) {
        const hant = speciesData.names.find(n => n.language.name.toLowerCase() === "zh-hant" || n.language.url.includes("/4/"));
        const hans = speciesData.names.find(n => n.language.name.toLowerCase() === "zh-hans" || n.language.url.includes("/12/"));
        if (hant) parsedName = hant.name;
        else if (hans) parsedName = hans.name;
      }

      if (!parsedName) {
         throw new Error("無法從官方取得繁體中文譯名，已拒絕寫入資料庫！");
      }

      let finalName = parsedName;
      for (const suffix of FORM_SUFFIXES) {
         if (pkmnData.name.includes(suffix.key)) {
            finalName += suffix.val;
            break;
         }
      }
      parsedName = finalName;

      const varieties = speciesData.varieties.map(v => {
         const parts = v.pokemon.url.split('/').filter(Boolean);
         return parseInt(parts[parts.length - 1]);
      });

      const flavorTexts = [];
      const seenVersions = new Set();
      const seenGames = new Set(); 
      let isFallback = false;
      
      if (pkmnData.game_indices) {
          pkmnData.game_indices.forEach(g => seenGames.add(g.version.name));
      }
      if (speciesData.flavor_text_entries) {
          speciesData.flavor_text_entries.forEach(e => seenGames.add(e.version.name));
      }

      let finalGamesArr = Array.from(seenGames);
      if (speciesData.id === 25) { 
          finalGamesArr.push('scarlet', 'violet', 'legends-z-a');
      }
      
      finalGamesArr = filterGamesByForm(finalGamesArr, pkmnData.name);
      finalGamesArr = [...new Set(finalGamesArr)];

      if (speciesData.flavor_text_entries) {
        let targetEntries = speciesData.flavor_text_entries.filter(e => ["zh-hant", "zh-tw", "zh-hans"].includes(e.language.name.toLowerCase()));
        let fallbackMsg = "";
        
        if (targetEntries.length === 0) {
          targetEntries = speciesData.flavor_text_entries.filter(e => ["ja", "ja-hrkt"].includes(e.language.name.toLowerCase()));
          if (targetEntries.length > 0) fallbackMsg = "[無官方中文，顯示日文] ";
          isFallback = true;
        }
        
        if (targetEntries.length === 0) {
          targetEntries = speciesData.flavor_text_entries.filter(e => e.language.name.toLowerCase() === "en");
          if (targetEntries.length > 0) fallbackMsg = "[無官方中日文，顯示英文] ";
          isFallback = true;
        }

        targetEntries = targetEntries.filter(e => finalGamesArr.includes(e.version.name));
        
        targetEntries.forEach(entry => {
          const vName = entry.version.name;
          if (!seenVersions.has(vName)) {
            seenVersions.add(vName);
            flavorTexts.push({
              version: vName,
              text: fallbackMsg + entry.flavor_text.replace(/[\f\n\r]/g, ' ')
            });
          }
        });
      }
      
      if (flavorTexts.length === 0) {
        flavorTexts.push({ version: "default", text: "暫無圖鑑介紹資料。" });
        isFallback = true;
      }

      const parsedSprite = pkmnData.sprites?.versions?.['generation-ii']?.crystal?.front_default || pkmnData.sprites?.front_default || "";
      const parsedShinySprite = pkmnData.sprites?.versions?.['generation-ii']?.crystal?.front_shiny || pkmnData.sprites?.front_shiny || "";

      return {
        id: pkmnData.id || targetId,
        speciesId: speciesData.id, 
        name: parsedName,
        types: (pkmnData.types || []).map(t => t.type.name),
        height: pkmnData.height || 0,
        weight: pkmnData.weight || 0,
        spriteUrl: parsedSprite,
        shinySpriteUrl: parsedShinySprite,
        varieties: varieties, 
        games: finalGamesArr, 
        flavorText: flavorTexts[0].text,
        flavorTexts: flavorTexts,
        isFallback: isFallback,
        updatedAt: new Date().toISOString()
      };
    }

    // 5. 查詢邏輯
    async function fetchPokemon(searchId) {
      if (!currentUser) return;
      if (!searchId || searchId < 1) return;

      currentPokemonId = searchId;
      elements.input.value = "";

      showView('loading');
      elements.dataSourceLabel.classList.add('hidden');

      try {
        const docRef = doc(db, 'pokedex', String(searchId));
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          const needsUpgrade = !data.varieties || data.varieties.length === 0 || !data.speciesId || !data.games;
          const hasChineseName = /[\u4e00-\u9fa5]/.test(data.name);
          const isIncorrectLanguage = !hasChineseName && data.isFallback !== true;

          if (needsUpgrade || isIncorrectLanguage) {
            console.log(`[Auto-Heal] 偵測到 ID ${searchId} 需要補齊資料，強制淨化更新...`);
            const cleanData = await fetchAndParseFromPokeAPI(searchId);
            await setDoc(docRef, cleanData);
            renderPokemon(cleanData);
            setIndicators('api');
          } else {
            renderPokemon(data);
            setIndicators('cloud');
          }
        } else {
          const cleanData = await fetchAndParseFromPokeAPI(searchId);
          await setDoc(docRef, cleanData);
          renderPokemon(cleanData);
          setIndicators('api');
        }
        showView('pokemon');
      } catch (err) {
        console.error("Fetch/Database Error:", err);
        if (err.code === 'permission-denied' || (err.message && err.message.includes('permissions'))) {
          showView('error', "Firestore 權限不足而被拒絕讀寫！", true);
        } else {
          showView('error', err.message || "讀取失敗，請確認網路狀態。");
        }
      }
    }

    // 6. GraphQL 高速資料庫升級作業
    elements.syncBtn.addEventListener('click', async () => {
      if (!currentUser || isSyncing) return;
      
      if (!confirm("即將開始「全圖鑑資料淨化」。\n系統將自動補齊「登場世代版本」，並清除錯放資料。確定要開始嗎？")) return;

      isSyncing = true;
      elements.syncBtn.classList.add('hidden');
      elements.syncContainer.classList.remove('hidden');
      elements.syncStatusText.innerText = "向官方伺服器請求最新跨世代資料 (約 3-5 秒)...";
      elements.syncPercentage.innerText = "0%";
      elements.syncBar.style.width = "0%";

      try {
        let pokemonList = [];
        for (let offset = 0; offset <= 1025; offset += 200) {
          elements.syncStatusText.innerText = `向官方伺服器打包資料 (第 ${offset} ~ ${Math.min(offset + 200, 1025)} 筆)...`;
          const query = `
            query {
              pokemon_v2_pokemon(limit: 200, offset: ${offset}) {
                id
                name
                height
                weight
                pokemon_v2_pokemongameindices {
                  pokemon_v2_version { name }
                }
                pokemon_v2_pokemontypes {
                  pokemon_v2_type { name }
                }
                pokemon_v2_pokemonspecy {
                  id
                  pokemon_v2_pokemons { id }
                  pokemon_v2_pokemonspeciesnames {
                    name
                    pokemon_v2_language { name }
                  }
                  pokemon_v2_pokemonspeciesflavortexts(where: {pokemon_v2_language: {name: {_in: ["zh-Hant", "zh-hant", "zh-Hans", "zh-hans", "zh-tw", "ja", "ja-Hrkt", "en"]}}}) {
                    flavor_text
                    pokemon_v2_version { name }
                    pokemon_v2_language { name }
                  }
                }
              }
            }
          `;

          const response = await fetch('https://beta.pokeapi.co/graphql/v1beta', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
          });

          if (!response.ok) throw new Error(`GraphQL 伺服器拒絕連線 (狀態碼: ${response.status})`);
          
          const json = await response.json();
          if (json.errors) throw new Error("GraphQL 查詢錯誤: " + json.errors[0].message);
          
          pokemonList = pokemonList.concat(json.data.pokemon_v2_pokemon);
          
          await new Promise(resolve => setTimeout(resolve, 300));
        }

        elements.syncStatusText.innerText = "資料請求完成！開始淨化 Firebase 資料庫...";

        let successCount = 0;
        let skippedCount = 0;
        
        for (const p of pokemonList) {
          let parsedName = null;
          const flavorTexts = [];
          const seenVersions = new Set();
          const seenGames = new Set(); 
          
          if (p.pokemon_v2_pokemongameindices) {
              p.pokemon_v2_pokemongameindices.forEach(g => seenGames.add(g.pokemon_v2_version?.name));
          }

          const specy = p.pokemon_v2_pokemonspecy;
          const speciesId = specy?.id || p.id;
          const varieties = specy?.pokemon_v2_pokemons?.map(v => v.id) || [p.id];
          let isFallback = false;
          
          if (specy) {
            const names = specy.pokemon_v2_pokemonspeciesnames || [];
            const hant = names.find(n => n.pokemon_v2_language.name.toLowerCase() === "zh-hant");
            const hans = names.find(n => n.pokemon_v2_language.name.toLowerCase() === "zh-hans");
            if (hant) parsedName = hant.name;
            else if (hans) parsedName = hans.name;

            const allFlavors = specy.pokemon_v2_pokemonspeciesflavortexts || [];
            allFlavors.forEach(f => seenGames.add(f.pokemon_v2_version?.name));

            const cnFlavors = allFlavors.filter(f => ["zh-hant", "zh-hans", "zh-tw"].includes(f.pokemon_v2_language.name.toLowerCase()));
            const jaFlavors = allFlavors.filter(f => ["ja", "ja-hrkt"].includes(f.pokemon_v2_language.name.toLowerCase()));
            const enFlavors = allFlavors.filter(f => f.pokemon_v2_language.name.toLowerCase() === "en");

            let targetFlavors = cnFlavors;
            let fallbackMsg = "";
            
            if (targetFlavors.length === 0 && jaFlavors.length > 0) {
                targetFlavors = jaFlavors;
                fallbackMsg = "[無官方中文，顯示日文] ";
                isFallback = true;
            } else if (targetFlavors.length === 0 && enFlavors.length > 0) {
                targetFlavors = enFlavors;
                fallbackMsg = "[無官方中日文，顯示英文] ";
                isFallback = true;
            }

            let finalGamesArr = Array.from(seenGames);
            if (speciesId === 25) {
                finalGamesArr.push('scarlet', 'violet', 'legends-z-a');
            }
            finalGamesArr = filterGamesByForm(finalGamesArr, parsedName || p.name);
            finalGamesArr = [...new Set(finalGamesArr)];

            targetFlavors = targetFlavors.filter(f => finalGamesArr.includes(f.pokemon_v2_version?.name));

            targetFlavors.forEach(f => {
              const vName = f.pokemon_v2_version?.name || "default";
              if (!seenVersions.has(vName)) {
                seenVersions.add(vName);
                flavorTexts.push({
                  version: vName,
                  text: fallbackMsg + f.flavor_text.replace(/[\f\n\r]/g, ' ')
                });
              }
            });
          }

          if (flavorTexts.length === 0) {
             flavorTexts.push({ version: "default", text: "暫無圖鑑介紹資料。" });
             isFallback = true;
          }

          if (!parsedName) {
            console.warn(`ID ${p.id} 缺乏中文譯名，已跳過更新以保護資料庫。`);
            skippedCount++;
            continue;
          }

          let finalName = parsedName;
          for (const suffix of FORM_SUFFIXES) {
             if (p.name.includes(suffix.key)) {
                finalName += suffix.val;
                break;
             }
          }
          parsedName = finalName;

          let finalGamesArr = Array.from(seenGames);
          if (speciesId === 25) {
              finalGamesArr.push('scarlet', 'violet', 'legends-z-a');
          }
          finalGamesArr = filterGamesByForm(finalGamesArr, p.name);
          finalGamesArr = [...new Set(finalGamesArr)];

          const spriteUrl = p.id <= 251 
            ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/crystal/${p.id}.png`
            : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
            
          const shinyUrl = p.id <= 251 
            ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/crystal/shiny/${p.id}.png`
            : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${p.id}.png`;

          const cleanData = {
            id: p.id,
            speciesId: speciesId,
            name: parsedName,
            types: p.pokemon_v2_pokemontypes.map(t => t.pokemon_v2_type.name),
            height: p.height || 0,
            weight: p.weight || 0,
            spriteUrl: spriteUrl,
            shinySpriteUrl: shinyUrl,
            varieties: varieties, 
            games: finalGamesArr, 
            flavorText: flavorTexts[0].text,
            flavorTexts: flavorTexts,
            isFallback: isFallback,
            updatedAt: new Date().toISOString()
          };

          const docRef = doc(db, 'pokedex', String(p.id));
          await setDoc(docRef, cleanData);

          successCount++;
          const percent = Math.floor(((successCount + skippedCount) / 1025) * 100);
          elements.syncPercentage.innerText = `${percent}%`;
          elements.syncBar.style.width = `${percent}%`;
        }

        alert(`✅ 資料淨化升級完成！\n成功同步 ${successCount} 筆最新資料！`);
        
        fetchPokemon(currentPokemonId);

      } catch (err) {
        console.error("Bulk Sync Error:", err);
        alert(`更新發生錯誤並中斷！\n\n原因：${err.message}`);
      } finally {
        isSyncing = false;
        elements.syncBtn.classList.remove('hidden');
        elements.syncContainer.classList.add('hidden');
      }
    });

    // 7. 表單送出監聽
    elements.form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = parseInt(elements.input.value);
      if (val >= 1 && val <= MAX_POKEMON_ID) {
        fetchPokemon(val);
      } else {
        alert(`搜尋編號必須在 1 到 ${MAX_POKEMON_ID} 之間。`);
      }
    });

    // 8. 系統認證與初始化
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          try {
            await signInWithCustomToken(auth, __initial_auth_token);
          } catch (tokenErr) {
            console.warn("Token 不匹配，正在切換至匿名登入...", tokenErr);
            await signInAnonymously(auth);
          }
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error("Auth Error:", err);
        showView('error', "系統認證失敗，無法連接雲端資料庫。");
      }
    };
    initAuth();

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        fetchPokemon(25);
      }
    });

  </script>
</body>
</html>
